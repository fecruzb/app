services:
  postgres:
    image: postgres:16
    container_name: app-base-postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app_base
    ports:
      - "5442:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app_base"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
