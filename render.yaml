# Render blueprint: one web service (API + SPA in the same process) + Postgres.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: app
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    preDeployCommand: npm run db:migrate
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: app-db
          property: connectionString
      # Public URL used in email links (must match the custom domain).
      - key: APP_URL
        value: https://app.fecruzb.com
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ASSISTANT_MODEL
        value: gpt-4o-mini
      - key: TRANSCRIBE_MODEL
        value: gpt-4o-mini-transcribe
      - key: AI_MONTHLY_BUDGET_USD
        value: "10"
      - key: SELF_SIGNUP_ENABLED
        value: "true"

databases:
  - name: app-db
    plan: basic-256mb
    postgresMajorVersion: "16"
