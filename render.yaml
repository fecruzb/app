# Render blueprint: one web service (API + SPA in the same process) + Postgres.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: app
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    preDeployCommand: npm run db:migrate
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: app-db
          property: connectionString
      # Public URL used in email links (set in the Render dashboard).
      - key: APP_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ASSISTANT_MODEL
        value: gpt-4o-mini
      - key: TRANSCRIBE_MODEL
        value: gpt-4o-mini-transcribe
      - key: IMAGE_MODEL
        value: gpt-image-1-mini
      - key: SELF_SIGNUP_ENABLED
        value: "true"
      # Comma-separated emails always treated as platform admins once verified
      - key: PLATFORM_ADMIN_EMAILS
        sync: false
      # Tauri shells (desktop/mobile). Comma-separated Origins, e.g.
      # tauri://localhost,https://tauri.localhost
      - key: CORS_ORIGIN
        sync: false
      # Image storage (Cloudflare R2) — set in the dashboard (not committed).
      - key: CLOUDFLARE_ACCESS_KEY_ID
        sync: false
      - key: CLOUDFLARE_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_S3_API
        sync: false
      - key: CLOUDFLARE_MEDIA_BUCKET
        value: app
      - key: R2_PUBLIC_BASE_URL
        sync: false

databases:
  - name: app-db
    plan: basic-256mb
    postgresMajorVersion: "16"
