# Render blueprint: one web service (API + SPA in the same process) + Postgres.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: app-base
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    preDeployCommand: npm run db:migrate
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: app-base-db
          property: connectionString
      # Without APP_URL set, the API uses RENDER_EXTERNAL_URL in email links.
      # Set it when using a custom domain:
      # - key: APP_URL
      #   value: https://yourdomain.com
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ASSISTANT_MODEL
        value: gpt-4o-mini
      - key: SELF_SIGNUP_ENABLED
        value: "true"

databases:
  - name: app-base-db
    plan: basic-256mb
    postgresMajorVersion: "16"
