# Render blueprint: one web service (API + SPA in the same process) + Postgres.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: app
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    preDeployCommand: npm run db:migrate
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: app-db
          property: connectionString
      # Public URL used in email links (must match the custom domain).
      - key: APP_URL
        value: https://app.fecruzb.com
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ASSISTANT_MODEL
        value: gpt-4o-mini
      - key: TRANSCRIBE_MODEL
        value: gpt-4o-mini-transcribe
      - key: IMAGE_MODEL
        value: gpt-image-1-mini
      - key: AI_MONTHLY_BUDGET_USD
        value: "10"
      - key: SELF_SIGNUP_ENABLED
        value: "true"
      # Comma-separated emails always treated as platform admins once verified
      - key: PLATFORM_ADMIN_EMAILS
        sync: false
      # Image storage (R2, Cloudflare) — same account/credentials as the cookbook.
      - key: CLOUDFLARE_ACCESS_KEY_ID
        sync: false
      - key: CLOUDFLARE_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_S3_API
        value: https://284c6858f001f4b66fca4ef0ed2ee4ae.r2.cloudflarestorage.com
      - key: CLOUDFLARE_MEDIA_BUCKET
        value: app
      - key: R2_PUBLIC_BASE_URL
        value: https://pub-d10da37e3ba9454b8c90e6345f47d90b.r2.dev

databases:
  - name: app-db
    plan: basic-256mb
    postgresMajorVersion: "16"
