[package]
name = "app-base-mobile"
version = "0.1.0"
description = "App Base iOS shell"
authors = ["Your Name <you@example.com>"]
edition = "2021"

[lib]
# The `_lib` suffix is required so the lib name stays unique when Tauri links
# the app as a shared/static library on mobile (`cdylib` / `staticlib` + `rlib`).
name = "app_base_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
