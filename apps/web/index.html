<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/brand/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/brand/logo.svg" />
    <meta name="description" content="%BRAND_DESCRIPTION%" />
    <meta property="og:title" content="%BRAND_TITLE%" />
    <meta property="og:description" content="%BRAND_DESCRIPTION%" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%BRAND_NAME%" />
    <meta property="og:image" content="/brand/logo.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="%BRAND_TITLE%" />
    <meta name="twitter:description" content="%BRAND_DESCRIPTION%" />
    <title>%BRAND_TITLE%</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Apply stored prefs before paint so dark/lang reloads don't flash. -->
    <script>
      try {
        var m = localStorage.getItem("app:mode");
        // Default is dark (emerald); only skip when the user chose light.
        if (m !== "light") {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
        var lang = localStorage.getItem("app:lang");
        if (lang === "en" || lang === "pt") {
          document.documentElement.lang = lang;
        } else if ((navigator.language || "").toLowerCase().indexOf("pt") === 0) {
          document.documentElement.lang = "pt";
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
