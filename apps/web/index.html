<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="App Base — multi-tenant SaaS template ready for your product"
    />
    <title>App Base</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Apply the stored mode before paint so dark reloads don't flash white. -->
    <script>
      try {
        var m = localStorage.getItem("app:mode");
        if (m === "dark") {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
