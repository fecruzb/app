<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Open-source multi-tenant SaaS template with auth, tenants, email, an AI agent, and a typed monorepo ready to become your product."
    />
    <meta property="og:title" content="App Base — The starting point for your next SaaS" />
    <meta
      property="og:description"
      content="Open-source multi-tenant SaaS template with auth, tenants, email, an AI agent, and a typed monorepo ready to become your product."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="App Base" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="App Base — The starting point for your next SaaS" />
    <meta
      name="twitter:description"
      content="Open-source multi-tenant SaaS template with auth, tenants, email, an AI agent, and a typed monorepo ready to become your product."
    />
    <title>App Base — The starting point for your next SaaS</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Apply stored prefs before paint so dark/lang reloads don't flash. -->
    <script>
      try {
        var m = localStorage.getItem("app:mode");
        if (m === "dark") {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
        var lang = localStorage.getItem("app:lang");
        if (lang === "en" || lang === "pt") {
          document.documentElement.lang = lang;
        } else if ((navigator.language || "").toLowerCase().indexOf("pt") === 0) {
          document.documentElement.lang = "pt";
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
